      #   KEYSTORE_STORE_PASSWORD
      #   KEYSTORE_KEY_ALIAS
      #   KEYSTORE_KEY_PASSWORD
      # Then uncomment the steps below. The keystore is written outside the
      # checkout so it never ends up in the workspace, and is cleaned up after.
